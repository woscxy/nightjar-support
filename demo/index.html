<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="description" content="A sample article for seeing what Nightjar does to a website without a dark theme of its own.">
  <title>Wildlife Journal</title>
  <link rel="stylesheet" href="demo.css">
  <!-- A light-only page on purpose: no prefers-color-scheme rules and no dark colors, so whatever
       dark version you see comes from Nightjar. Used for the App Store screenshots
       (Scripts/capture-store-screenshots.py). ?lang=ja picks a language. -->
  <script src="strings.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="column">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="title">Wildlife Journal</span>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
  </header>
  <main class="column layout">
    <article>
      <p class="kicker" data-text="kicker"></p>
      <h1 data-text="title"></h1>
      <p class="dek" data-text="dek"></p>
      <p class="byline" data-text="byline"></p>
      <figure>
        <img class="hero" src="nightjar.svg" width="640" height="300" data-label="caption">
        <figcaption data-text="caption"></figcaption>
      </figure>
      <p data-text="p1"></p>
      <aside class="note">
        <h3 data-text="noteTitle"></h3>
        <p data-text="note"></p>
      </aside>
      <p data-text="p2"></p>
      <table>
        <caption data-text="tableTitle"></caption>
        <tbody id="facts"></tbody>
      </table>
      <p data-text="p3"></p>
      <p data-text="p4"></p>
      <p class="more"><span data-text="more"></span> <a href="#listen" data-text="link1"></a> · <a href="#walks" data-text="link2"></a></p>
      <button type="button" class="listen" data-text="button"></button>
    </article>
    <aside class="side">
      <h2 data-text="mostRead"></h2>
      <ol>
        <li><a href="#read1" data-text="read1"></a></li>
        <li><a href="#read2" data-text="read2"></a></li>
        <li><a href="#read3" data-text="read3"></a></li>
      </ol>
    </aside>
  </main>
  <script>
    for (const node of document.querySelectorAll("[data-text]")) node.textContent = demo.text[node.dataset.text];
    for (const node of document.querySelectorAll("[data-label]")) node.setAttribute("alt", demo.text[node.dataset.label]);
    const facts = document.getElementById("facts");
    for (const [name, value] of demo.facts) {
      const row = facts.insertRow();
      row.insertCell().textContent = name;
      row.insertCell().textContent = value;
    }
  </script>
</body>
</html>
